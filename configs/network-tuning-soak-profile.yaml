experiments:
  - name: small-48-flow16-p8
    patch:
      flavors.network_worker: m1.benchmark
      targets.network.gbps: 600
      targets.network.scope: per_host
      targets.network.per_host_gbps: 200
      workloads.network.topology: full_mesh
      workloads.network.flow_duration: 60s
      workloads.network.omit_seconds: 10
      workloads.network.parallel_streams_per_flow: 8
      workloads.network.target_gbps_per_flow: 16
      workloads.network.sender_worker_target_gbps: 20
      workloads.network.receiver_worker_target_gbps: 20
      workloads.network.max_flows: 1000
      workloads.network.max_workers: 96
      workloads.network.zerocopy: false
      workloads.network.reverse: false
      workloads.network.bidirectional: false

