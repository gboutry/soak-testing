openstack:
  external_network: external-network
  image: ubuntu-mixed-benchmark
  ssh_user: ubuntu
  member_role: member
  admin_role: admin

management:
  mode: floating_ip
  controller_floating_ip: true
  allowed_cidrs:
    - 0.0.0.0/0
  ssh_private_key_path: null

resources:
  project_prefix: soak-tester
  create_project: true
  create_project_user: true
  create_router: true
  network_cidr: 10.250.0.0/24
  floating_ips:
    controller: true
    workers: false

flavors:
  controller: m1.benchmark
  compute_worker: m1.benchmark-4c
  network_worker: m1.benchmark-xl
  storage_worker: m1.benchmark
  api_worker: m1.benchmark

capacity:
  compute:
    vcpus: 0
    ram_gib: 0
  network:
    gbps: 200
    scope: per_host
    per_host_gbps: 200
  storage:
    read_gbps: 0
    write_gbps: 0
    iops: 0
  api:
    ops_per_second: 0

workloads:
  api:
    enabled: false
    run_from: local
    operation_mix: {}
  compute:
    enabled: false
    cpu_load_percent: 95
    memory_load_percent: 70
  network:
    enabled: true
    protocol: tcp
    tool: iperf3
    topology: full_mesh
    hosts:
      - pc8a-rb3-n1.maas
      - pc8a-rb3-n2.maas
    flow_duration: 60s
    parallel_streams_per_flow: 16
    target_gbps_per_flow: 100
    sender_worker_target_gbps: 200
    receiver_worker_target_gbps: 200
    receiver_port_base: 5201
    max_flows: 16
    max_workers: 8
  storage:
    enabled: false
    volume_type: null
    volume_size_gib: 10
    profile: mixed-randrw
    block_size: 4k
    iodepth: 32
    numjobs: 4
    rwmixread: 70
    worker_count: 0

monitoring:
  live_status:
    enabled: true
    refresh_interval: 5s
  worker_metrics:
    enabled: true
    interval: 5s

observability:
  enabled: false
  prometheus:
    enabled: false

run:
  warmup: 1m
  cooldown: 1m
  failure_budget: 2
  stop_on_error: false
  leave_running: true
  cleanup_on_success: false
