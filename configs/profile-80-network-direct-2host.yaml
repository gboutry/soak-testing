openstack:
  external_network: external-network
  image: ubuntu-mixed-benchmark
  ssh_user: ubuntu
  member_role: member

management:
  mode: floating_ip
  controller_floating_ip: true
  allowed_cidrs:
    - 0.0.0.0/0
  ssh_private_key_path: null

resources:
  project_prefix: soak-tester
  create_project: true
  create_project_user: true
  create_router: true
  network_cidr: 10.250.0.0/22
  network_mtu: 8942
  floating_ips:
    controller: true
    workers: false

flavors:
  controller: m1.benchmark
  compute_worker: m1.benchmark-4c-mem
  network_worker: m1.benchmark-net-direct-16c
  storage_worker: m1.benchmark
  api_worker: m1.benchmark

targets:
  compute:
    vcpus: 0
    ram_gib: 0
    cpu_resource_class: PCPU
    ram_resource_class: MEMORY_MB
  network:
    gbps: 400
    scope: per_host
    per_host_gbps: 200
  storage:
    read_gbps: 0
    write_gbps: 0
    iops: 0
  api:
    ops_per_second: 0

workloads:
  api:
    enabled: false
    engine: rally
    run_from: local
    rally_mode: saturation
    rally_concurrency: 32
    rally_times: null
    rally_include_create_delete: false
    rally_error_rate_max: 0
    operation_mix:
      list_servers: 40
      list_ports: 30
      list_volumes: 20
      create_delete_ports: 10

  compute:
    enabled: false
    cpu_load_percent: 95
    memory_load_percent: 95
    worker_count: 0
    flavor_mix:
      - m1.benchmark-4c-mem

  network:
    enabled: true
    protocol: tcp
    tool: iperf3
    vnic_type: direct
    hardware_offload_type: switchdev
    port_security_enabled: false
    topology: full_mesh
    hosts:
      - pc8a-rb3-n2.maas
      - pc8a-rb3-n3.maas
    flow_duration: 180s
    omit_seconds: 15
    parallel_streams_per_flow: 16
    target_gbps_per_flow: 25
    sender_worker_target_gbps: 50
    receiver_worker_target_gbps: 50
    zerocopy: true
    tcp_window: null
    receiver_port_base: 5201
    max_flows: 1000
    max_workers: 96

  storage:
    enabled: false
    volume_type: __DEFAULT__
    volume_size_gib: 100
    profile: mixed-randrw
    block_size: 4k
    iodepth: 32
    numjobs: 4
    rwmixread: 70
    worker_count: 0

monitoring:
  live_status:
    enabled: true
    refresh_interval: 5s
  worker_metrics:
    enabled: true
    interval: 5s

run:
  warmup: 5m
  cooldown: 2m
  failure_budget: 5
  stop_on_error: false
  leave_running: false
  cleanup_on_success: true

boot_concurrency: 36

calibration:
  pass_ratio: 0.95
  ramp_duration: 3m
  validation_duration: 10m
  derate_policy: auto_once
  network_direction: egress
