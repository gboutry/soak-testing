experiments:
  - name: baseline
    patch:
      workloads.network.flow_duration: 60s
      workloads.network.omit_seconds: 10
      workloads.network.parallel_streams_per_flow: 16
      workloads.network.target_gbps_per_flow: 50
      workloads.network.sender_worker_target_gbps: 100
      workloads.network.receiver_worker_target_gbps: 100
      workloads.network.zerocopy: false
      workloads.network.reverse: false
      workloads.network.bidirectional: false

  - name: zerocopy
    patch:
      workloads.network.flow_duration: 60s
      workloads.network.omit_seconds: 10
      workloads.network.parallel_streams_per_flow: 16
      workloads.network.target_gbps_per_flow: 50
      workloads.network.sender_worker_target_gbps: 100
      workloads.network.receiver_worker_target_gbps: 100
      workloads.network.zerocopy: true
      workloads.network.reverse: false
      workloads.network.bidirectional: false

  - name: zerocopy-p32
