# Run with: promtool test rules tests/fixtures/showcase-promql.yaml
# Python tests ensure these expressions stay aligned with the dashboard.
rule_files: []
evaluation_interval: 1m
tests:
- name: panel18.A.normal
  interval: 1m
  input_series:
  - series: libvirt_domain_info_vstate{domain="vm-a"}
    values: 1x5
  - series: libvirt_domain_info_vstate{domain="vm-b"}
    values: 1x5
  - series: libvirt_domain_info_vstate{domain="vm-c"}
    values: 5x5
  promql_expr_test:
  - expr: count_values("state", libvirt_domain_info_vstate{domain=~".*"} or libvirt_domain_info_state{domain=~".*"})
    eval_time: 5m
    exp_samples:
    - labels: '{state="1"}'
      value: 2
    - labels: '{state="5"}'
      value: 1
- name: panel62.A.normal
  interval: 1m
  input_series:
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.0"}
    values: 1x5
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.0"}
    values: 1x5
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.1"}
    values: '0x5'
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.1"}
    values: 1x5
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.2"}
    values: 1x5
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.2"}
    values: '0x5'
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.3"}
    values: '0x5'
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.3"}
    values: '0x5'
  promql_expr_test:
  - expr: sum(((ceph_osd_up == bool 0) + (ceph_osd_in == bool 0)) > bool 0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 3
- name: panel88.A.normal
  interval: 1m
  input_series:
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.0"}
    values: 1x5
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.0"}
    values: 1x5
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.1"}
    values: '0x5'
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.1"}
    values: 1x5
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.2"}
    values: 1x5
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.2"}
    values: '0x5'
  - series: ceph_osd_up{instance="ceph",ceph_daemon="osd.3"}
    values: '0x5'
  - series: ceph_osd_in{instance="ceph",ceph_daemon="osd.3"}
    values: '0x5'
  promql_expr_test:
  - expr: sum(((ceph_osd_up == bool 0) + (ceph_osd_in == bool 0)) > bool 0)
    eval_time: 5m
    exp_samples:
    - labels: '{}'
      value: 3
- name: panel76.A.normal
  interval: 1m
  input_series:
  - series: ceph_pool_percent_used{instance="ceph",pool_id="1"}
    values: 0.25x5
  - series: ceph_pool_metadata{instance="ceph",pool_id="1",name="images"}
    values: 1x5
  promql_expr_test:
  - expr: 100 * sum by (name) (ceph_pool_percent_used * on (instance, pool_id) group_left(name)
      ceph_pool_metadata{name=~".*"})
    eval_time: 5m
    exp_samples:
    - labels: '{name="images"}'
      value: 25
- name: panel73.A.normal
  interval: 1m
  input_series:
  - series: ceph_pool_rd_bytes_total{instance="ceph",pool_id="1"}
    values: 0+120x5
  - series: ceph_pool_rd_bytes{instance="ceph",pool_id="1"}
    values: 0+60x5
  - series: ceph_pool_rd_bytes{instance="ceph",pool_id="2"}
    values: 0+180x5
  - series: ceph_pool_metadata{instance="ceph",pool_id="1",name="images"}
    values: 1x5
  - series: ceph_pool_metadata{instance="ceph",pool_id="2",name="volumes"}
    values: 1x5
  promql_expr_test:
  - expr: sum by (name) ((rate(ceph_pool_rd_bytes_total[5m]) or rate(ceph_pool_rd_bytes[5m]))
      * on (instance, pool_id) group_left(name) ceph_pool_metadata{name=~".*"})
    eval_time: 5m
    exp_samples:
    - labels: '{name="images"}'
      value: 2
    - labels: '{name="volumes"}'
      value: 3
