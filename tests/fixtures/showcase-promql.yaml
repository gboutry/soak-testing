- name: panel91.A.normal
  interval: 1m
  input_series:
  - series: openstack_nova_agent_state{id="alive"}
    values: 1x5
  - series: openstack_cinder_agent_state{id="down"}
    values: '0x5'
  promql_expr_test:
  - expr: ((openstack_nova_agent_state or openstack_nova_agent_state_total) == 0)
      or ((openstack_neutron_agent_state or openstack_neutron_agent_state_total) ==
      0) or ((openstack_cinder_agent_state or openstack_cinder_agent_state_total)
      == 0)
    eval_time: 5m
