- name: panel80.A.normal
  interval: 1m
  input_series:
  - series: openstack_nova_agent_state{id="new"}
    values: 1x5
  - series: openstack_nova_agent_state_total{id="new"}
    values: '0x5'
  - series: openstack_nova_agent_state_total{id="legacy"}
    values: '0x5'
  promql_expr_test:
  - expr: (openstack_nova_agent_state or openstack_nova_agent_state_total)
    eval_time: 5m
    exp_samples:
    - labels: openstack_nova_agent_state{id="new"}
      value: 1
    - labels: openstack_nova_agent_state_total{id="legacy"}
