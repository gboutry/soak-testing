- name: panel47.A.normal
  interval: 1m
  input_series:
  - series: ovs_vswitchd_dp_packets_total{instance="host",datapath="ovs-system"}
    values: 0+60x5
  promql_expr_test:
  - expr: clamp_min(delta(ovs_vswitchd_dp_packets_total{instance=~".*"}[5m]) / 300,
      0)
    eval_time: 5m
    exp_samples:
    - labels: '{instance="host",datapath="ovs-system"}'
      value: 1
- name: panel47.A.reset
  interval: 1m
  input_series:
  - series: ovs_vswitchd_dp_packets_total{instance="host",datapath="ovs-system"}
    values: 1000 1010 10 20 30 40
  promql_expr_test:
  - expr: clamp_min(delta(ovs_vswitchd_dp_packets_total{instance=~".*"}[5m]) / 300,
      0)
    eval_time: 5m
    exp_samples:
    - labels: '{instance="host",datapath="ovs-system"}'
      value: 0
