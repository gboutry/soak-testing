openstack:
  external_network: ext-net
  image: ubuntu-soak
  member_role: member
boot_concurrency: 1
management:
  allowed_cidrs:
  - 0.0.0.0/0
resources:
  project_prefix: soak-tester
  create_router: true
  network_cidr: 10.250.0.0/24
  network_mtu: null
  floating_ips:
    controller: true
flavors:
  controller: m1.soak-controller
  compute_worker: m1.soak-compute
  network_worker: m1.soak-net
  storage_worker: m1.soak-fio
workloads:
  api:
    enabled: true
    operation_mix:
      list_servers: 40
      list_ports: 30
      list_volumes: 20
      create_delete_ports: 10
  compute:
    enabled: true
    cpu_load_percent: 95
    memory_load_percent: 70
  network:
    enabled: true
    flow_duration: 60s
    parallel_streams_per_flow: 4
    target_gbps_per_flow: 10
  storage:
    enabled: true
    volume_type: ceph-ssd
    volume_size_gib: 100
    profile: mixed-randrw
    block_size: 4k
    iodepth: 32
    numjobs: 4
    rwmixread: 70
observability:
  prometheus:
    enabled: true
    url: http://prometheus.example.internal:9090
    timeout: 30s
    query_step: 15s
    auth:
      type: none
      token_file: null
      username: null
      password_env: null
    tls:
      verify: true
      ca_file: null
    network:
      device_regex: bond.*|eno.*|ens.*|eth.*
      exclude_device_regex: lo|docker.*|veth.*|tap.*|qbr.*|qvo.*|qvb.*
    query_packs:
    - node-exporter-network
run:
  keep_resources: false
targets:
  compute:
    vcpus: 960
    ram_gib: 3072
  network:
    gbps: 600
  storage:
    read_gbps: 160
    write_gbps: 80
    iops: 500000
  api:
    ops_per_second: 100
