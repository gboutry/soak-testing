openstack:
  external_network: ext-net
  image: ubuntu-soak
  ssh_user: ubuntu
  member_role: member

management:
  mode: floating_ip
  controller_floating_ip: true
  allowed_cidrs:
    - 0.0.0.0/0
  ssh_private_key_path: null

resources:
  project_prefix: soak-tester
  create_project: true
  create_project_user: true
  create_router: true
  network_cidr: 10.250.0.0/24
  floating_ips:
    controller: true
    workers: false

flavors:
  controller: m1.soak-controller
  compute_worker: m1.soak-compute
  network_worker: m1.soak-net
  storage_worker: m1.soak-fio
  api_worker: m1.soak-api

capacity:
  compute:
    vcpus: 960
    ram_gib: 3072
  network:
    gbps: 600
  storage:
    read_gbps: 160
    write_gbps: 80
    iops: 500000
  api:
    ops_per_second: 100

workloads:
  api:
    enabled: true
    run_from: local
    operation_mix:
      list_servers: 40
      list_ports: 30
      list_volumes: 20
      create_delete_ports: 10
  compute:
    enabled: true
    cpu_load_percent: 95
    memory_load_percent: 70
  network:
    enabled: true
    protocol: tcp
    tool: iperf3
    flow_duration: 60s
    parallel_streams_per_flow: 4
    target_gbps_per_flow: 10
  storage:
    enabled: true
    volume_type: ceph-ssd
    volume_size_gib: 100
    profile: mixed-randrw
    block_size: 4k
    iodepth: 32
    numjobs: 4
    rwmixread: 70

monitoring:
  live_status:
    enabled: true
    refresh_interval: 5s
  worker_metrics:
    enabled: true
    interval: 5s

observability:
  enabled: true
  prometheus:
    enabled: true
    url: http://prometheus.example.internal:9090
    timeout: 30s
    query_step: 15s
    auth:
      type: none
      token_file: null
      username: null
      password_env: null
    tls:
      verify: true
      ca_file: null
    labels:
      host_label: instance
      hostname_label: hostname
    network:
      enabled: true
      device_regex: "bond.*|eno.*|ens.*|eth.*"
      exclude_device_regex: "lo|docker.*|veth.*|tap.*|qbr.*|qvo.*|qvb.*"
    query_packs:
      - node-exporter-network

run:
  warmup: 5m
  cooldown: 2m
  failure_budget: 5
  stop_on_error: false
  leave_running: false
  cleanup_on_success: true
